<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="pt1">
        <div class="logo"><img src="" alt="Logo" /></div>
        <nav>
          <ul>
            <li>
              <a href="#epocas-locais"
                >Épocas/Locais
                <img src="files/icon1.png" alt="Ícone Seta" class="seta"
              /></a>
            </li>
            <li>
              <a href="#reservas"
                >Reservas
                <img src="files/icon1.png" alt="Ícone Seta" class="seta"
              /></a>
            </li>
            <li>
              <a class="tpplus" href="#tp-plus"
                >TP Plus
                <img src="files/icon1.png" alt="Ícone Seta" class="seta"
              /></a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="pt2">
        <div class="user">
          <a href="#">
            <img
              src="files/user-icon.png"
              alt="Ícone de Usuário"
              class="img-user"
            />
            Acesssar | Registrar-se</a
          >
        </div>
        <div class="lingua" id="btnLingua">
          <a href="#">
            <img src="files/language-icon.png" alt="Ícone de Idioma" />
            PT-BR &bull; R$
          </a>
        </div>
      </div>
    </header>

    <div class="modal-lingua" id="modalLingua">
      <div class="modal-content">
        <h3>Selecione o idioma</h3>
        <ul>
          <li><a href="#" data-lang="pt">🇧🇷 Português</a></li>
          <li><a href="#" data-lang="en">🇺🇸 English</a></li>
          <li><a href="#" data-lang="es">🇪🇸 Español</a></li>
        </ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
